# Pinning the project name keeps volume/container names stable whether the
# stack is started by VS Code's Dev Containers CLI or a manual `docker compose` call.
name: odoo-develop-environment

services:
  odoo:
    image: odoo:20.0
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/workspace/odoo-develop-environment/.devcontainer/odoo-entrypoint.sh"]
    # Clear the image CMD; the custom entrypoint below owns the default startup.
    command: []
    environment:
      ODOO_CONFIG: /workspace/odoo-develop-environment/config/odoo.conf
      ODOO_AUTO_START: ${ODOO_AUTO_START:-true}
    init: true
    ports:
      - "${ODOO_HTTP_PORT:-8069}:8069"
      - "${ODOO_GEVENT_PORT:-8072}:8072"
    stdin_open: true
    tty: true
    volumes:
      - ..:/workspace/odoo-develop-environment:cached
      - odoo-data:/var/lib/odoo

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  odoo-data:
  postgres-data:
